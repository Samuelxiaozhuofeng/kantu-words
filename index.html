<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>看图记词</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#f5efe3">
<style>
:root{
  --paper:#f5efe3;--card:#fffbf3;--line:#e3d9c6;--ink:#1c2233;--dim:#6f6a5e;
  --mark:#2b5fd9;--mark-soft:#dfe8fb;--ok:#2f9e5b;--bad:#e4573d;--sun:#f4b942;
  --r:16px;--shadow:0 1px 2px rgba(28,34,51,.06),0 8px 24px -12px rgba(28,34,51,.25);
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top))}
header a{color:var(--ink);text-decoration:none;font-weight:800}
header .logo{display:flex;align-items:center;gap:8px;font-size:18px}
header .logo i{width:14px;height:14px;border-radius:4px;background:var(--mark);box-shadow:0 0 0 3px var(--mark-soft);transform:rotate(-8deg)}
header .sp{flex:1}
header .ghost{color:var(--dim);font-weight:600}
main{padding:8px 20px 40px;max-width:1280px;margin:0 auto}
h2,h3{margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:15px;color:var(--dim);letter-spacing:.04em;margin-top:22px}
button,.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:700;line-height:1.2;text-decoration:none;transition:transform .08s,background .15s,border-color .15s}
button:hover,.btn:hover{border-color:var(--ink)}
button:active,.btn:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.primary,.btn.primary{background:var(--mark);border-color:var(--mark);color:#fff}
button.primary:hover,.btn.primary:hover{background:#2250c2}
button.danger{color:var(--bad)}
button.danger:hover{border-color:var(--bad)}
input,select,textarea{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--mark);box-shadow:0 0 0 3px var(--mark-soft)}
label.field{display:block;margin:10px 0;color:var(--dim);font-size:13px;font-weight:700}
label.field input,label.field select,label.field textarea{margin-top:4px;font-weight:500}
label.field textarea{min-height:80px;resize:vertical}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;user-select:none}
.bar .chk input{width:auto;flex:none;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{width:auto;flex:1;min-width:140px}
.bar select{width:auto}
.muted{color:var(--dim);font-size:14px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px;color:var(--dim);background:#fff}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:9;font-weight:600;box-shadow:var(--shadow)}
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:6px}

/* 首页「今天」卡 */
.today{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;padding:20px 24px;background:linear-gradient(135deg,var(--card),#fff8e6)}
.today .tl{font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.today .tn{font-size:22px;font-weight:800;margin:4px 0 6px}
.today .tn b{font-size:34px;letter-spacing:-.03em;color:var(--mark)}
.today .tright{display:flex;align-items:center;gap:18px;flex:none}
.today .streak{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1}
.today .streak small{display:block;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.04em;margin-top:2px}
.today .week{display:flex;gap:5px}
.today .week i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.today .week i.on{background:var(--ok)}
.today .week i.now{box-shadow:0 0 0 2px var(--sun)}
.btn.big{font-size:18px;padding:12px 26px}
button.mini{padding:2px 10px;font-size:12px;margin-left:4px}
.card .n.due{right:auto;left:10px;top:auto;bottom:10px;background:var(--sun);color:var(--ink)}
.card .body .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card .body .row b{margin:0;min-width:0}
.ring{flex:none;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring i{width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:var(--dim)}
/* 学习页记忆反馈 */
.fb{min-height:20px;font-size:14px;font-weight:700;color:var(--mark)}
.fb:empty{display:none}
.segs .auto{font-size:13px;font-weight:700;align-self:center}
.study.learn .hint{color:var(--dim);font-size:16px;font-weight:700;min-height:auto}
.study.learn .answer{color:var(--ink);font-size:30px;font-weight:800}
.study.learn .answer .ipa{font-size:17px;color:var(--dim)}
.result li .lv{font-size:12px;color:var(--mark);font-weight:700;white-space:nowrap}
@media(max-width:820px){
  .today{flex-direction:column;align-items:stretch;padding:16px}
  .today .tright{justify-content:space-between}
}

/* 课程列表 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--mark)}
.card a.pic{display:block;position:relative;background:#e8e2d5}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.card .n.lang{right:auto;left:10px;background:var(--mark)}
.card .n{position:absolute;right:10px;top:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px}
.card .body{padding:12px 14px 14px}
.card .body b{display:block;font-size:17px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .body .bar{margin:0;gap:6px}
.card .body button,.card .body .btn{padding:6px 12px;font-size:14px}

/* 图片舞台与框 */
.two{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}
.study .two{grid-template-columns:3fr 2fr}
@media(max-width:820px){.two,.study .two{grid-template-columns:1fr}}
.stage{position:relative;overflow:hidden;border-radius:var(--r);background:#e8e2d5;user-select:none;touch-action:none;box-shadow:var(--shadow)}
.stage img{width:100%;display:block;pointer-events:none}
.box{position:absolute;border:2.5px solid var(--mark);border-radius:8px;cursor:move;box-shadow:0 0 0 1.5px rgba(255,255,255,.9),inset 0 0 0 1.5px rgba(255,255,255,.9);transition:border-color .15s}
.box:hover{border-color:var(--sun)}
.box.sel{border-color:var(--sun);box-shadow:0 0 0 9999px rgba(28,34,51,.55),0 0 0 1.5px #fff,inset 0 0 0 1.5px #fff}
.box .tag{position:absolute;left:-1px;top:-1px;background:var(--mark);color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px 0 8px 0;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.box.sel .tag{background:var(--sun);color:var(--ink)}
.study .box{cursor:default;border-color:var(--sun)}
.study .box.sel{transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1),width .35s,height .35s}
/* 听音点图 / 听句子点图：平时不画框，图是干净的；答对亮黄、答完留个绿勾、点错的物品红一下并带名字 */
.study.tap .stage,.study.sent .stage{cursor:pointer}
.study.tap .box,.study.sent .box{pointer-events:none;border-color:transparent;box-shadow:none;transition:border-color .15s}
.study.tap .box .tag,.study.sent .box .tag{display:none}
.study.tap .box.sel,.study.sent .box.sel{border-color:var(--sun);box-shadow:0 0 0 9999px rgba(28,34,51,.55),0 0 0 1.5px #fff,inset 0 0 0 1.5px #fff}
.study.tap .box.ok::after,.study.sent .box.ok::after{content:'✓';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.study.tap .box.bad,.study.sent .box.bad{animation:shake .3s;border-color:var(--bad);box-shadow:0 0 0 1.5px #fff,inset 0 0 0 1.5px #fff}
.study.tap .box.bad .tag,.study.sent .box.bad .tag{display:block;background:var(--bad);color:#fff;max-width:none}
/* 四选一 */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.choices button{justify-content:center;font-size:18px;padding:12px 8px}
.choices button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.choices button.bad{border-color:var(--bad);color:var(--bad);opacity:.6}

/* AI 出课页 */
.crumbs{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--dim)}
.crumbs button{border:none;background:none;padding:4px 6px;color:var(--mark)}
.crumbs button:last-child{color:var(--ink);cursor:default}
.topics{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.topics button{font-size:17px;padding:12px 20px}
.topics button .muted{font-size:12px;font-weight:600}
.topics .x{padding:6px 10px;font-size:14px;color:var(--dim)}
.thinking{padding:12px 4px;font-size:17px}
.dots i{font-style:normal;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
.topic{display:inline-flex;align-items:center;gap:6px}
.topic input{width:18px;height:18px;margin:0;flex:none}
.genbar{position:sticky;bottom:0;background:#fff;border-top:1.5px solid var(--line);padding:10px 0;margin:0}
.genprog{flex-direction:column;align-items:flex-start;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}

/* 备课页 */
.form{padding-bottom:14px;margin-bottom:14px;border-bottom:1.5px dashed var(--line)}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .bar{margin:12px 0 0}
.words{max-height:40vh;overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.words div{display:flex;gap:8px;align-items:baseline;padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.words div:last-child{border-bottom:none}
.words div:hover{background:var(--paper)}
.words div.sel{background:var(--mark-soft)}
.words b{font-weight:700}
.words .muted{margin-left:auto;font-size:13px}
.words:empty{display:none}
.wcards{display:flex;flex-direction:column;gap:8px;max-width:640px;margin-top:8px}
.wcard{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.wcard .crop{position:relative;width:80px;height:80px;flex:none;overflow:hidden;border-radius:8px;background:var(--paper)}
.wcard .crop img{position:absolute;max-width:none}
.wcard .info{flex:1;min-width:0;font-size:15px}
.wcard .info b{font-size:17px}
.wcard .ipa{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--dim)}
.wcard .sent{font-size:14px;margin-top:4px}
.wcard .sentZh{font-size:13px;color:var(--dim)}
.wcard .col{font-size:13px;color:var(--dim);margin-top:2px}
.wcard .info b a{color:inherit;text-decoration:none}
.wcard .info b a:hover{color:var(--mark)}
.wcard small{display:block;margin-top:4px;font-size:12px}
.wcard .ops{display:flex;flex-direction:column;gap:6px;flex:none}
.wcard .ops button{padding:4px 10px;font-size:13px}
.hintbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
.hintbar b{white-space:nowrap}
.hintbar .muted{text-align:right;font-size:13px}
.placeholder{padding:60px 20px;text-align:center;color:var(--dim);display:flex;flex-direction:column;gap:12px;align-items:center;min-height:300px;justify-content:center}
.placeholder b{font-size:20px;color:var(--ink)}
.placeholder .bar{margin:0;justify-content:center}

/* 学习页 */
.study{outline:none}
.study .top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.study .step{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1}
.study .step small{font-size:14px;color:var(--dim);font-weight:700;letter-spacing:0;margin-left:4px}
.study .top b{font-size:17px}
.segs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.seg{flex-wrap:wrap;justify-content:center} /* 手机上六种练法一行放不下：整个按钮换行，别把「打单词」拆成两行 */
.seg button{border:none;padding:5px 12px;font-size:13px;color:var(--dim);background:none;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.progress{height:6px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.deck{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:26px 20px 18px}
.hint{font-size:30px;font-weight:800;min-height:46px;letter-spacing:-.01em}
.hint.blank{color:var(--line)}
.big{font-size:32px;font-weight:700;text-align:center;border:none;border-bottom:3px solid var(--mark);border-radius:0;background:none;width:min(300px,100%);color:var(--ink);padding:6px 4px;box-shadow:none}
.big:focus{box-shadow:none}
.big::placeholder{color:var(--line);font-weight:500}
.big.ok{border-color:var(--ok);color:var(--ok)}
.big.bad{animation:shake .3s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.answer{color:var(--dim);min-height:26px;font-size:17px}
.answer .ipa{font-family:ui-monospace,Menlo,monospace;font-size:15px}
.answer .sent{display:block;font-size:14px;font-weight:500;margin-top:6px}
.answer .sentZh{display:block;font-size:13px;font-weight:400}
.answer .col{display:block;font-size:14px;font-weight:500;margin-top:2px}
.answer .more{display:block;margin-top:8px;font-size:14px;font-weight:500}
.answer .more a{color:var(--mark)}
.answer.ok{color:var(--ok);font-weight:700}
.cols{margin:8px 0 0;padding-left:1.2em;font-size:15px}
.wordpage{max-width:640px;margin:0 auto}
.wordpage .wordhead h2{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.wordpage .ipa{font-family:ui-monospace,Menlo,monospace;font-size:15px;color:var(--dim)}
.wordpage .wcard{margin-top:8px}
.wordpage .wcard .btn{padding:4px 10px;font-size:13px;margin-top:4px}
.deck .bar{margin:0;justify-content:center;gap:6px}
.deck .tips{margin:0}
.result{text-align:center;max-width:520px;margin:20px auto}
.result .score{font-size:56px;font-weight:900;letter-spacing:-.03em;color:var(--ok);line-height:1}
.result ul{list-style:none;padding:0;margin:20px 0;text-align:left}
.result li{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line)}
.result li .muted{margin-left:4px}
.result li .chk{margin-left:auto;font-size:13px;white-space:nowrap}
.result li .k{width:22px;text-align:center;font-weight:900}
.result li .k.ok{color:var(--ok)}.result li .k.no{color:var(--bad)}
.result .bar{justify-content:center;margin-top:20px}
@media(max-width:820px){
  main{padding:4px 14px 32px}
  .deck{position:static;padding:18px 12px 12px}
  .hint{font-size:26px;min-height:40px}
  .big{font-size:28px}
  .study .top{flex-wrap:wrap}
  .deck .tips{display:none}
  .deck .bar button{padding:8px 12px}
  .box:not(.sel) .tag{display:none}
}
</style>
</head>
<body>
<header><a class="logo" href="#/"><i></i>看图记词</a><span class="sp"></span><a class="ghost" href="#/settings">设置</a></header>
<main id="view"></main>
<script type="module" src="app.js"></script>
</body>
</html>
